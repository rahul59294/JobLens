[project]
name = "joblens"
version = "0.1.0"
description = "Local-first CLI for analyzing skills in job descriptions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "rich>=13.9",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.scripts]
joblens = "joblens.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joblens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
